default_language_version:
    python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    # Should match version in requirements.txt
    rev: v0.17.4
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [ python, pyi, jupyter ]
        exclude: ^notebooks/.*\.py$
        args: [ --fix ]
      # # Run the formatter.
      # - id: ruff-format
      #   types_or: [ python, pyi, jupyter ]

  - repo: local
    hooks:
      - id: marimo-check
        name: marimo check
        entry: uv run marimo check
        language: system
        files: ^notebooks/.*\.py$
        args: [--fix, --strict, --ignore-scripts]
