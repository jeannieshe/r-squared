defaults:
  - task    # loads configs/task.yaml: response, target, budget, seeds
  - policy: random  # loads configs/policy/<name>.yaml; override with policy=ucb policy.beta=2.0
  - _self_  # then the rest of run.yaml: wandb, hydra

wandb:
  entity: goodarzilab
  project: r-squared

hydra:
  run:
    dir: results/${now:%Y-%m-%d}/${now:%H-%M-%S}_${policy.name}